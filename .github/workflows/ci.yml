name: CI

# Previously there was no CI at all — every push to main went straight to Railway with
# no automated gate, so a broken build or a regression only surfaced once it was live.
#
# This has two jobs:
#   1. typecheck-and-build always runs and needs no secrets — it's the guaranteed-green
#      baseline (backend + frontend typecheck, frontend production build).
#   2. integration-tests only runs if the DATABASE_URL_DEV repo secret is set (Settings
#      -> Secrets and variables -> Actions -> New repository secret, using the same
#      values already in the local .env: DATABASE_URL_DEV, JWT_SECRET, VAULT_MASTER_KEY).
#      It boots the real server against the isolated Neon dev branch and runs the actual
#      money-paths integration suite (src/tests/moneyPaths.test.ts) against it — the same
#      test file every local `npm test` run already uses. Skipped (not failed) until
#      those secrets exist, so job 1 alone is useful immediately.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install backend dependencies
        run: npm ci
      - name: Typecheck backend
        run: npx tsc -p tsconfig.json --noEmit
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Typecheck + build frontend
        run: npm run build
        working-directory: frontend

  integration-tests:
    runs-on: ubuntu-latest
    needs: typecheck-and-build
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL_DEV }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      VAULT_MASTER_KEY: ${{ secrets.VAULT_MASTER_KEY }}
      PORT: 4000
    steps:
      - name: Skip if dev-database secret isn't configured yet
        id: gate
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL_DEV secret not set — skipping integration tests. See this workflow's header comment for setup."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip == 'false'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.skip == 'false'
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        if: steps.gate.outputs.skip == 'false'
        run: npm ci
      - name: Build
        if: steps.gate.outputs.skip == 'false'
        run: npx tsc -p tsconfig.json
      - name: Start server in the background
        if: steps.gate.outputs.skip == 'false'
        run: |
          node dist/server.js &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/health > /dev/null; then
              echo "Server is up."
              exit 0
            fi
            sleep 1
          done
          echo "Server never became healthy." >&2
          exit 1
      - name: Run money-paths test suite
        if: steps.gate.outputs.skip == 'false'
        run: node --test dist/tests/**/*.test.js
